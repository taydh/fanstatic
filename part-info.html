		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
        
        <!-- Icons: Bootstrap icon -->

        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
		<script defer src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.4/beautify-html.min.js"></script>
		
		<script defer src="https://fanstatic.annexdesk.com/v2/fanstatic.js"></script>
		<script>
			{
                let fanstaticVersion = 'v2';
                let origin = window.location.origin;
				let hostEnv = null;
				const usp = new URLSearchParams(window.location.search);

				const resolveHostEnv = async function(){
					let originPath = origin;

					// relative path
					[
						'/fanstatic',
						'/fanstatic2',
						'/fanstatic3',
					].forEach(path => {
						if (window.location.href.startsWith(origin + path)) originPath = origin + path;
					});

					// absolute origin
					if (!hostEnv) {
						hostEnv = await fanstatic.fetchJson(originPath + '/env.' + window.location.host.replace(/[:/]/g, "_") + '.json');
					}

					document.head.querySelector('base').href = hostEnv.document_base_uri;
				}

				const loadExtensions = async function(asyncCounter) {
					fanstatic.assign({
						base_url: hostEnv.fanstatic_base_url,
						theme: 'earth',
						theme_framework: 'bulma',
						theme_mode: 'less',
						library_less_url: 'https://cdn.jsdelivr.net/npm/less',
						trail_span: hostEnv.trail_span,
						log_render: false,
					});

					await fanstatic.insertScripts([
						fanstatic.getVersionedBaseUrl() + 'ext.tools.js?' + fanstatic.tail(),
						fanstatic.getVersionedBaseUrl() + 'ext.visual.js?' + fanstatic.tail(),
						fanstatic.getVersionedBaseUrl() + 'ext.design.js?' + fanstatic.tail(),
						fanstatic.getVersionedBaseUrl() + 'ext.template.js?' + fanstatic.tail(),
						fanstatic.getVersionedBaseUrl() + 'ext.style.js?' + fanstatic.tail(),
					]);
				}
				
				const main = async function(){
                    await resolveHostEnv();
					await loadExtensions();

					const themingPromises = [];

					if (fanstatic.settings.theme_style) {
						const prom = fanstatic.applyTheme();
						if (prom) themingPromises.push(prom);
					}
					
					if ('less' == fanstatic.settings.theme_mode) {
						const prom = fanstatic.applyLess();
						if (prom) themingPromises.push(prom);
					}

					Promise.all(themingPromises).then(() => {
						less.pageLoadFinished.then(async function() {
							// This code will execute after Less has finished compiling and applying styles
							console.log('Less compilation and styling complete!');
							// You can now safely interact with the DOM or perform other actions
							// that rely on the final CSS being loaded.

							const main = document.body.querySelector('main');
							const frameInfo = usp.get('frame');
							const prefixSafeList = ['base.', 'block.', 'cluster.', 'card.',  'nav.', 'section.', 'layout.'];
							const selector = prefixSafeList.map(val => `template[data-url*="${val}"]`).join(',');
							const safeList = Array.from(document.querySelectorAll(selector)).map(elem => elem.dataset.url);

							if (!safeList.includes(frameInfo)) {
								// not run
								console.log('Not in safelist or sample not exists');
							}
							else {
								main.dataset.templateUrl = 'part-info';
								fanstatic.elementStorage.set(main, 'templateOptions', {
									model: {
										title: frameInfo,
										frame: frameInfo,
										code: html_beautify(fanstatic._getTemplateElement(frameInfo).outerHTML),
									}
								})
							}
							
							console.log('load templates by running command')

							await fanstatic.searchAndRunCommand(document.body);

							console.log('Layout ready');

							fanstatic.applyClassfix(document.body, fanstatic.getClassfix('general'), 'general');
							window.dispatchEvent(new CustomEvent('document_classfixed'));
							document.body.querySelector('.layout').classList.remove('is-hidden');
							
						});
					})
				};
                
                document.addEventListener('DOMContentLoaded', main);
			}
		</script>

			<template data-url="infobox">

				<div data-frame="block.actionable">
					Panel block.basic-block also used internally to form other general purpose panels.
					It based on block-base-unit with different context properties and unlike block.base-unit this panel implement basic styling when use theme.
					It accept direct image url and accept subjects and notes as an array.
				</div>

				</div>

{ mainTag: 'main' }
{ mainTag: 'div' }
{ mainTag: 'section' }
</pre>

				</div>
