<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<base href=""> <!-- relative -->
		<title></title>
		
		<link rel="icon" type="image/x-icon" href="https://park.annexdesk.com/resources/favicon_io/text.fs-noto-sans-yi/favicon.ico">
		
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap">
		
		<script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/default.min.css">
		<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
		
		<script defer src="https://fanstatic.annexdesk.com/v2/fanstatic.js"></script>
		
		<script>
			/*
			 * this page is part of fanstatic development, hence fanstatic loaded dynamically and the slowest way
			 * for usual use where fanstatic loaded normally in <head>, see https://fanstatic.annexdesk.com/docs
			 * */
			{
				let origin = window.location.origin;
				let host_env = null;
				
				const resolveOrigin = async function(){
					let originPath = origin;

					// relative path
					[
						'/fanstatic2',
					].forEach(path => {
						if (window.location.href.startsWith(origin + path)) originPath = origin + path;
					});

					// absolute origin
					if (!host_env) {
						host_env = await fanstatic.fetchJson(originPath + '/env.' + window.location.host.replace(/[:/]/g, "_") + '.json');
					}
					
					document.head.querySelector('base').href = host_env.document_base_uri;

					fanstatic.insertStyles([
						`${document.baseURI}/assets/css/stbs-5-3.css`,
						`${document.baseURI}/assets/css/main.css`,
					]);
				}
				
				const init = async function(){
					fanstatic.append(
						document.body, fanstatic.getVersionedBaseUrl() + 'frames/action/back-to-top-button.html',
						{ tail_key: null }
					)

					Object.assign(fanstatic.visual.settings, {
						log_render: true,
						turn_delay: 300,
					})
					
					await fanstatic.insert(
						document.querySelector('#container'), // target element 
						'./assets/templates/layout_page.htm',
						{
							data: {
								host_env: host_env,
							}
						}
					)
				}

				document.addEventListener('DOMContentLoaded', async function () {
					await resolveOrigin();

					fanstatic.assign({
						base_url: host_env.fanstatic_base_url,
						tail_span: '5s',
						log_render: false,
						log_process: true,
					});

					const asyncCounter = fanstatic.asyncCounter(5, () => init());

					window.addEventListener('fanstatic.visual.load', () => asyncCounter.done());
					window.addEventListener('fanstatic.template.load', () => asyncCounter.done());
					window.addEventListener('fanstatic.design.load', () => asyncCounter.done());
					window.addEventListener('fanstatic.tools.load', () => asyncCounter.done());

					fanstatic.insertScripts([
						fanstatic.getVersionedBaseUrl() + 'ext.visual.js?' + fanstatic.trail(),
						fanstatic.getVersionedBaseUrl() + 'ext.tools.js?' + fanstatic.trail(),
						fanstatic.getVersionedBaseUrl() + 'ext.design.js?'  + fanstatic.trail(),
						fanstatic.getVersionedBaseUrl() + 'ext.template.js?' + fanstatic.trail(),
					]).then(() => asyncCounter.done());	
				});
			}
		</script>
	</head>

	<body>
		<div id="container"></div>

		<!-- Bootstrap style override -->
		<style>
			#container {
				--gutter: 0;
				--gutter-sm: 3rem;
				--gutter-md: 5rem;
			}
		</style>

		<!-- Own custom style -->
		 <style>
			:root {
				--font-family--header: "Merriweather", serif;
				--fixed-padding-top: 130px;
				--hero-height: 50vh;

				--letter-spacing-1: -.250em;
				--letter-spacing-2: -.125em;
				--letter-spacing-3: 0em;
				--letter-spacing-4: .125em;
				--letter-spacing-5: .250em;
			}

			/* -- Element -- */
			html {
				scroll-padding-top: var(--fixed-padding-top);
				font-size: 18px;
				letter-spacing: .5px;
			}

			body {
				background-color: var(--bs-gray-100);
			}

			h2 {
				font-family: var(--font-family--header);
				font-size: var(--stbs-font-size--display-5);
				font-weight: var(--stbs-font-weight--display-5);
				margin-top: 1.5rem;
				margin-bottom: 1.5rem;
				text-align: center;
			}
			
			main {
				margin-top: var(--fixed-padding-top);
			}

			main > section:not(:last-child) {
				margin-bottom: 1rem;
				border-bottom: var(--bs-border-width) var(--bs-border-style) var(--bs-border-color) !important;
			}

			/* -- ID -- */

			#headbar {
				background-color: white;
				height: var(--fixed-padding-top);
			}

			#hero {
				background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)), url('https://park.annexdesk.com/resources/pexels/pexels-kamo11235-667838--land-sm.jpg');
				background-repeat: no-repeat;
				background-size: cover;
				background-position: center;

				color: white;
				height: var(--hero-height);
				margin-bottom: 1rem;
			}

			/* -- Class -- */

			/* -- Other Attributes -- */

			*[data-fanstatic-visual-animation] {
				visibility: hidden;
			}

			/* -- Media Query -- */
			@media (min-width: 768px) {
				:root {
					--fixed-padding-top: 80px;
				}
			}

			@media (min-width: 992px) {
				#hero {
					background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://park.annexdesk.com/resources/pexels/pexels-kamo11235-667838--land-md.jpg');
				}
			}

			@media (min-width: 1200px) {
				#hero {
					background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://park.annexdesk.com/resources/pexels/pexels-kamo11235-667838--land-lg.jpg');
				}
			}
		 </style>
	</body>
</html>
