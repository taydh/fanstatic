<script>
	const design = fanstatic.design;

	return async function(roof, data = {}, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		model.featureImageSrc = model.featureImageSrc || '';
		model.category = data.category || '';
		model.title = data.title || '';
		model.$titleLink = data.$titleLink === false ? false : true;
		model.brief = data.brief || '';
		model.date = data.date || '';
		model.url = data.url || '#';
		model.author = data.author || '';
		model.authorLink = data.authorLink || '#';
		model.authorPhoto = data.authorPhoto || '';
		model.disabled = data.disabled || false;

		const blockController = await fanstatic.appendPart(roof, 'block.unit', 
			Object.assign(model, {
				cap: (model.featureImageSrc ? {img: true} : false),
				head: [
					design.tag(model.$categoryTag || 'div', { data:{'pt':'category'} }),
					design.tag(model.$titleTag || 'h3', { data:{'pt':'title'} }, design.tag(model.$titleLink ? 'a' : 'span')),
					design.tag(model.$dateTag || 'div', { data:{'pt':'date'} }),
					design.tag(model.$authorTag || 'div', { data:{'pt':'author'} }), 
				],
				body: [
					design.tag(model.$briefTag || 'div', {data: {pt: 'brief'}}),
				],
				foot: [
					design.div([design.tag('a', {data: {'pt': 'button-more'}}, 'Read more')]),
				],

				$tag: data.$tag || 'article',
			})
		);

		let elem;

		if (model.featureImageSrc) {
			elem = blockController.select('cap').children[0];
			elem.src = model.featureImageSrc;
		}

		elem = blockController.select('title').children[0];
		elem.textContent = model.title;

		if (model.$titleLink) {
			elem.href = model.url;
		}

		elem = blockController.select('button-more');
		elem.href = model.url;

		elem = blockController.select('brief');
		elem.textContent = model.brief;

		['category', 'date', 'author'].forEach(prop => {
			blockController.select(prop).textContent = model[prop];
		});

		this.controller = blockController;
	}
</script>
