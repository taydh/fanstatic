<script>
	const design = fanstatic.design;

	return async function(roof, data = {}, url) {
		// A.

		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		model.backgroundImageSrc = model.backgroundImageSrc || '';
		model.disabled = model.disabled || false;

		// B.

		const baseController = await fanstatic.appendPart(roof, 'base.card', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$tag: model.$tag || null,
		})

		fanstatic.appendHtml(baseController.root, fanstatic.renderJhtm([
			design.div({ 'data-pt': 'cover' }),
			design.div({ 'data-pt': 'reveal' }),
		]));

		baseController.root.querySelectorAll('[data-ds]').forEach(elem => elem.removeAttribute('data-ds'));

		// C.
		
		const partController = new fanstatic.PartController(baseController.root);

		partController.cover = partController.select('cover');
		partController.reveal = partController.select('reveal');

		partController.coverController = await fanstatic.applyContent(partController.cover, model.cover, model.$innerScope);
		partController.revealController = await fanstatic.applyContent(partController.reveal, model.reveal, model.$innerScope);

		this.controller = partController;
	}
</script>
