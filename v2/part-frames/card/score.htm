<script>
	const design = fanstatic.design;

	return async function(roof, data, url) {
		// A. SET UP MODEL

		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		model.iconImageSrc = data.iconImageSrc || '';
		model.subject = data.subject || '';
		model.score = data.score || '';
		model.note = data.note || '';
		model.disabled = data.disabled || false;
		
		// B. CREATE FRAME
		
		const baseController = await fanstatic.appendPart(roof, 'base.card', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$tag: model.$tag || null,
			content: true,
		});

		const blockController = await fanstatic.replacePart(baseController.content, 'block.unit',
			Object.assign(model, {
				$id: null,
				$frame: null,
				$tag: null,
				$attr: {data: {pt: 'content'}},

				cap: model.iconImageSrc 
					? new fanstatic.Part('base.image', {
						data: {pt: 'iconImage'},
						src: model.iconImageSrc
					})
					: false,
				head: [
					design.tag(model.$scoreTag || 'div', {data: {pt: 'score'}}),	
					design.tag(model.$subjectTag || 'div', {data: {pt: 'subject'}}), 
				],
				body: [
					design.tag(model.$noteTag || 'div', {data: {pt: 'note'}})
				],
			})
		);

		// C. ASSIGN PROPERTIES AND APPLY VALUES

		// assign element as controller properties

		blockController.content = blockController.root;
		blockController.note = blockController.select('note');

		// apply attribute values


		// apply text contents

		['subject', 'score'].forEach(prop => {
			blockController.select(prop).textContent = model[prop];
		});

		// apply template contents and assign result as controller properties

		blockController.noteController = 
			await fanstatic.applyContent(blockController.select('note'), model.note, model.$innerScope);

		// remove attributes and propertyes
		
		blockController.root.removeAttribute('data-pt-frame');
		blockController.root.removeAttribute('data-pt-scope');
		
		delete blockController.headController;
		delete blockController.footController;
		delete blockController.foot;

		blockController.changeRoot(baseController.root);

		// D. ASSIGN CONTROLLER

		this.controller = blockController;
	}
</script>
