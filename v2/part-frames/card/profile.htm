<script>
	const design = fanstatic.design;

	return async function(roof, data = {}, url) {
		// A.

		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		model.photoImageSrc = model.photoImageSrc || '';
		model.name = model.name || '';
		model.title = data.title || '';
		model.company = data.company || '';
		model.short = data.short || '';
		model.socialLinks = [
				model.facebook ? {
					network: 'facebook',
					username: model.facebook,
					url: `https://www.facebook.com/${model.facebook}`,
				} : null,
				model.instagram ? {
					network: 'instagram',
					username: model.instagram,
					url: `https://www.instagram.com/${model.instagram}`,
				} : null,
				model.tiktok ? {
					network: 'tiktok',
					username: model.tiktok,
					url: `https://www.tiktok.com/${model.tiktok}`,
				} : null,
				model.twitterX ? {
					network: 'twitterX',
					username: model.twitterX,
					url: `https://www.x.com/${model.twitterX}`,
				} : null,
				model.linkedIn ? {
					network: 'linkedIn',
					username: model.linkedIn,
					url: `https://www.linkedin.com/in/${model.linkedIn}`,
				} : null,
		].filter(o => !!o);

		model.disabled = data.disabled || false;
		
		// B.

		const baseController = await fanstatic.appendPart(roof, 'base.card', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$tag: model.$tag || null,

			content: true,
		})

		const blockController = await fanstatic.replacePart(baseController.content, 'block.unit', 
			Object.assign(model, {
				$id: null,
				$frame: null,
				$tag: null,
				$attr: {data: {pt: 'content'}},

				cap: model.photoImageSrc ? new fanstatic.Part('base.image', {data: {pt: 'photoImage'}}) : false,
				head: [
					design.tag(data.$nameTag || 'h3', {data: {pt: 'name'}}),
					design.tag(data.$titleTag || 'div', {data: {pt: 'title'}}),
					design.tag(data.$companyTag || 'div', {data: {pt: 'company'}}),
				],
				foot: design.axis(
					{data: {pt:'socialLinks'}}, 
					model.socialLinks.map(o => design.div({data: {'pt-network': o.network}})
				)),
			})
		);

		for (let elem of blockController.select('socialLinks').children) {
			const network = elem.dataset.ptNetwork;
			const socialLink = model.socialLinks.find(o => o.network == network);
			const link = Object.assign(document.createElement('a'), {
				href: socialLink.url,
				textContent: socialLink.username
			});

			elem.appendChild(link);
		};

		// C.

		// ['photoImage', 'name', 'title', 'company', 'short'].forEach(prop => {
		// 	blockController[prop] = blockController.select(prop);
		// });

		if (model.photoImageSrc) {
			blockController.capController.root.src = model.photoImageSrc;
		}

		['name', 'title', 'company'].forEach(prop => {
			blockController.select(prop).textContent = model[prop];
		});

		['data-pt-frame', 'data-pt-scope'].forEach(attr => {
			blockController.root.removeAttribute(attr);
		});

		delete blockController.headController;
		delete blockController.footController;

		blockController.changeRoot(baseController.root);

		// D.

		this.controller = blockController;
	}
</script>
