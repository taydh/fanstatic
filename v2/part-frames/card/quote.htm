<script>
	const design = fanstatic.design;

	return async function(roof, data, url) {
		// A. SET UP MODEL

		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		model.photoImageSrc = data.photoImageSrc || '';
		model.name = data.name || true;
		model.company = data.company || true;
		model.position = data.position || true;
		model.quote = data.quote || true;
		model.disabled = data.disabled || false;
		
		// B. SET UP FRAME

		const baseController = await fanstatic.appendPart(roof, 'base.card', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$tag: model.$tag || null,

			content: true,
		})

		const blockController = await fanstatic.replacePart(baseController.content, 'block.unit',
			Object.assign(model, {
				$id: null,
				$frame: null,
				$tag: null,
				$attr: {data: {pt: 'content'}},

				cap: model.photoImageSrc 
					? new fanstatic.Part('base.image', { src: model.photoImageSrc, data: {pt: 'photoImage'} }) 
					: false,
				head: [
					design.tag(data.$nameTag || 'div', {'data-pt': 'name' }), 
					design.tag(data.$positionTag || 'div', { 'data-pt': 'position' }),
					design.tag(data.$companyTag || 'div', { 'data-pt': 'company' })
				],
				body: [
					design.tag(model.$quoteTag || 'blockquote', {data: {pt: 'quote'}})
				],
			})
		);

		// C. ASSIGN PROPS & APPLY VALUES

		['name', 'position', 'company'].forEach(prop => {
			blockController.select(prop).textContent = model[prop];
		});

		['data-pt-frame', 'data-pt-scope'].forEach(attr => {
			blockController.root.removeAttribute(attr);
		});

		blockController.quote = blockController.select('quote');
		blockController.quoteController = await fanstatic.applyContent(blockController.quote, model.quote, model.$innerScope);

		delete blockController.headController;
		delete blockController.bodyController;
		delete blockController.footController;
		delete blockController.foot;

		// D. ASSIGN CONTROLLER

		this.controller = blockController;
	}
</script>
