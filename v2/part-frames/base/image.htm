<script>
	return function(roof, data, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		if (model.$attr) model.$attr.src = null; // invalidate src in attribute, see next comment below

		fanstatic.insertHtml(roof, fanstatic.renderJhtm(
			fanstatic.design.tag('img', model.$attr)
		));
		
		const baseElement = roof.children[0];

		baseElement.dataset.ptFrame = model.$frame;

		if (model.$id) baseElement.id = model.$id;
		if (model.$scope) baseElement.dataset.ptScope = model.$scope;

		baseElement.src = model.src; // safe with DOM assignment without prior sanitazion

		this.controller = new fanstatic.PartController(baseElement, model.$scope, model.$frame);
	}
</script>
