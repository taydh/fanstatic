<script>
	const design = fanstatic.design;

	return async function (roof, data = {}, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		const baseController = await fanstatic.appendPart(roof, 'base.section', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$attr: model.$attr,

			content: true,
		});

		const blockPart = await fanstatic.replacePart(baseController.content, 'block.content', 
			Object.assign(model, {
				$id: null,
				$frame: null,
				$attr: {
					data: {pt: 'content'}
				},

				$titleTag: model.$titleTag || 'h2',
			})
		);

		blockPart.root.removeAttribute('data-pt-frame');
		blockPart.root.removeAttribute('data-pt-scope');

		blockPart.changeRoot(blockPart.root);

		this.controller = blockPart;
	}
</script>
