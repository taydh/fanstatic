<script>
	const design = fanstatic.design;

	return async function (roof, data = {}, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		const baseController = await fanstatic.appendPart(roof, 'base.section', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$attr: model.$attr,

			content: new fanstatic.Part('block.content', 
				Object.assign(model, {
					$id: null,
					$frame: null,
					$attr: null,

					$titleTag: model.$titleTag || 'h2',
				})
			)
		});

		baseController.content = baseController.contentController.root;

		this.controller = baseController;
	}
</script>
