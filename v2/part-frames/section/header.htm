<script>
	const design = fanstatic.design;

	return async function (roof, data, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		const baseController = await fanstatic.appendPart(roof, 'base.section', {
			$id: model.$id,
			$frame: model.$frame,
			$scope: model.$scope,
			$attr: model.$attr,

			content: true,
		});

		fanstatic.insertHtml(baseController.content, fanstatic.renderJhtm([
			design.div({data: {pt: 'brand'}}),
			design.div({data: {pt: 'navigation'}}),
			design.div({data: {pt: 'actions'}}),
		]));

		const controller = new fanstatic.PartController(baseController.root);

		controller.brand = controller.select('brand');
		controller.navigation = controller.select('navigation');
		controller.actions = controller.select('actions');

		// populate with content

		let brandProm, navigationProm, actionsProm;

		if (model.brand)
			brandProm = fanstatic.applyContent(controller.brand, model.brand, model.$innerScope);
		
		if (model.navigation)
			navigationProm = fanstatic.applyContent(controller.navigation, model.navigation, model.$innerScope);

		if (model.actions)
			actionsProm = fanstatic.applyContent(controller.actions, model.actions, model.$innerScope);

		const allResolve = await Promise.all([brandProm, navigationProm, actionsProm]);

		controller.brandController = allResolve[0];
		controller.navigationsController = allResolve[1];
		controller.actionsController = allResolve[2];

		this.controller = controller;
	};
</script>
