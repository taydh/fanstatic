<script>
	const design = fanstatic.design;

	return async function (roof, data = {}, url) {
		const model = Object.assign({}, data);

		model.id = model.$id || model.id || null;
		model.frame = model.frame || fanstatic.resolveFrame(url);

		roof.innerHTML = fanstatic.renderJhtm([
			design.unit(Object.assign(model.$attr || {}, {
				$tag: model.$tag,
				$capTag: model.$capTag,
				$headTag: model.$headTag,
				$bodyTag: model.$bodyTag,
				$footTag: model.$footTag,
			}), {
				mode: model.mode,
				cap: !!model.cap,
				head: !!model.head,
				body: !!model.body,
				foot: !!model.foot,
			})
		]);

		const root = roof.children[0];

		root.dataset.ptFrame = model.frame;

		if (model.id) root.id = model.id;
		if (model.scope) root.dataset.ptScope = model.scope;

		let capElem, headElem, bodyElem, footElem;
		let capProm, headProm, bodyProm, footProm;
		
		if (model.cap) {
			const target = capElem = root.querySelector('[data-ds=cap]')
			target.dataset.pt = 'cap';
			capProm = fanstatic.applyContent(target, model.cap, model.innerScope);
		}
		
		if (model.head) {
			const target = headElem = root.querySelector('[data-ds=head]');
			target.dataset.pt = 'head';
			headProm = fanstatic.applyContent(target, model.head, model.innerScope);
		}

		if (model.body) {
			const target = bodyElem = root.querySelector('[data-ds=body]');
			target.dataset.pt = 'body';
			bodyProm = fanstatic.applyContent(target, model.body, model.innerScope);
		}

		if (model.foot) {
			const target = footElem = root.querySelector('[data-ds=foot]')
			target.dataset.pt = 'foot';
			footProm = fanstatic.applyContent(target, model.foot, model.innerScope);
		}

		root.querySelectorAll(':scope > [data-ds]').forEach(elem => elem.removeAttribute('data-ds'));
		root.removeAttribute('data-ds');

		const resolves = await Promise.all([capProm, headProm, bodyProm, footProm]);

		const controller = new fanstatic.partController(root);

		// D.
		
		this.controller = Object.assign(controller, {
			cap: capElem,
			head: headElem,
			body: bodyElem,
			foot: footElem,
			capController: resolves[0],
			headController: resolves[1],
			bodyController: resolves[2],
			footController: resolves[3],
		});
	};
</script>
