<script>
	const design = fanstatic.design;

	return async function (roof, data = {}, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		if (data.subjects && !Array.isArray(data.subjects)) model.subjects = [data.subjects];
		if (data.actions && !Array.isArray(data.actions)) model.actions = [data.actions];
		
		model.head = model.subjects ? design.div({data: {'pt-role': 'axis'}}, model.subjects.map(() => design.div({data: {pt: 'subject'}}))) : false;
		model.body = model.messages ? design.div({data: {'pt-role': 'axis'}}, model.messages.map(() => design.div({data: {pt: 'message'}}))) : false;
		model.foot = model.actions ? design.div({data: {'pt-role': 'axis'}}, model.actions.map(() => design.div({data: {pt: 'action'}}))) : false;

		const unitController = await fanstatic.insertPart(roof, 'block.unit', model);
		
		delete unitController.headController;
		delete unitController.bodyController;
		delete unitController.footController;

		unitController.subjectControllers = [];
		unitController.messageControllers = [];
		unitController.actionControllers = [];

		const subjectElems = Array.from(unitController.selectAll('subject'));
		const messageElems = Array.from(unitController.selectAll('message'));
		const actionElems = Array.from(unitController.selectAll('action'));

		if (model.subjects) {
			for (let i=0; i<model.subjects.length; i++) {
				unitController.subjectControllers.push(await fanstatic.applyContent(subjectElems[i], model.subjects[i], model.$innerScope));
			}
		}

		if (model.messages) {
			for (let i=0; i<data.messages.length; i++) {
				unitController.messageControllers.push(await fanstatic.applyContent(messageElems[i], model.messages[i], model.$innerScope));
			}
		}

		if (model.actions) {
			for (let i=0; i<data.actions.length; i++) {
				unitController.actionControllers.push(await fanstatic.applyContent(actionElems[i], model.actions[i], model.$innerScope));
			}
		}

		this.controller = unitController;
	};
</script>
