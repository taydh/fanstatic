<script>
	const design = fanstatic.design;

	return async function (roof, data = {}, url) {
		const model = Object.assign({}, data, {
			$frame: data.$frame || fanstatic.resolveFrame(url)
		});

		const itemControllers = [];

		roof.innerHTML = fanstatic.renderJhtm(design.stack(
			Object.assign(model.$attr || {}, { $tag: model.$tag || 'ul'}),
			Object.assign(model.itemAttr || {}, { $tag: model.$itemTag || 'li' }),
			model.items ? model.items.map(item => design.placeholder()) : [],
		));

		const root = roof.children[0];

		root.removeAttribute('data-ds');
		root.dataset.ptFrame = model.$frame;

		if (model.$id) root.id = model.$id;
		if (model.$scope) root.dataset.ptScope = model.$scope;

		const placeholders = roof.querySelectorAll('[data-ds-placeholder]');

		if (model.items) {
			for (let i=0; i<model.items.length; i++) {
				placeholders[i].parentElement.dataset.pt = 'item';
				placeholders[i].parentElement.removeAttribute('data-ds');

				itemControllers.push(await fanstatic.applyContent(placeholders[i], model.items[i], model.innerScope, 'replace'));
			}
		}

		this.controller = Object.assign(new fanstatic.PartController(root, model.scope, model.frame), {
			itemControllers: itemControllers,
		});
	};
</script>
